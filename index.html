.chip.wn{border-color:var(--yl);color:var(--tx);background:rgba(250,204,21,.30)}
.lsb.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.lsd{margin-top:8px;border-top:1px solid var(--ln)}
.lsd .chips{padding:4px 0 6px}
.lsd .xlb{margin-left:0;padding-left:0}
.qs .xkg{gap:4px;padding:2px 8px 4px}
.qs .xkr>span{flex-basis:62px;padding-top:7px;font-size:10px}
.qs .xkc{flex-wrap:nowrap;overflow-x:auto;gap:5px;scrollbar-width:none}
.qs .xkb{padding:6px 9px;font-size:13px;white-space:nowrap;flex:none}
.qs .xsp{padding:4px 6px 2px}
.qs .xsp .xpp{padding:0 4px;min-height:44px}
.qs .xsp .xpp b{display:inline;font-size:13px;margin-left:4px}
.sfb{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--ln);margin-top:8px}
.sfx{flex:0 0 28%;border:1px solid var(--ln);border-radius:12px;background:var(--card);font-weight:600;font-size:16px;color:var(--mu);min-height:58px}
.sfx.dl{color:var(--no)}
.sfo{flex:1;min-width:0;border:2px solid var(--ok);border-radius:12px;background:var(--okbg);color:var(--ok);font-weight:700;font-size:16px;min-height:58px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.sfo small{display:block;max-width:100%;font-weight:500;font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.prb{display:block;width:100%;margin:8px 0 4px;padding:12px;border:2px solid var(--ac);border-radius:12px;background:rgba(211,73,155,.2);color:var(--act);font-weight:700;font-size:16px}
.sfo.wn{background:rgba(250,204,21,.30);border-color:var(--yl);color:var(--tx)}
.sfo:disabled{background:var(--ln);color:var(--mu)}
.bxh{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.bxh>b{min-width:0}
.qsm{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:16px;align-items:baseline;padding:0 8px}
.qsm>span:nth-child(odd){font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.qsm>span:nth-child(even){color:var(--tx);text-align:right}
.qsm b{color:var(--tx);font-size:16px;font-weight:700}
.lsb{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--act)}
.xgs>div{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:6px;align-items:center}
.xgs>div>:not(.xad){grid-column:1}
.xgs .v i{font-style:normal;font-size:12px;font-weight:600;color:var(--mu)}
.xad{grid-column:2;grid-row:1/4;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font-weight:700;font-size:14px;padding:12px 9px;white-space:nowrap}
.xzn .zc{font-weight:700}
.xrc{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 12px;border-bottom:1px solid var(--ln);font-size:16px}
.xrc span{color:var(--mu);flex:none;font-size:14px}
.xrc b{text-align:right;min-width:0;overflow-wrap:anywhere}
.xrc.w b{color:var(--no)}
.xrh{margin:4px 0 6px;border-radius:12px;background:var(--ac);color:var(--acx);text-align:center;font-size:18px;font-weight:700;padding:10px 12px}
.xrh small{display:block;font-weight:400;font-size:14px;opacity:.7;margin-top:2px}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--act);font-weight:700}.xkg{display:flex;flex-direction:column;gap:6px;padding:2px 8px 6px}.xkr{display:flex;align-items:flex-start;gap:8px}.xkr>span{flex:0 0 66px;padding-top:9px;font-size:13px;font-weight:700;color:var(--tx)}.xkc{display:flex;flex-wrap:wrap;gap:6px;min-width:0}.xkb{padding:8px 11px;font-size:14px;line-height:1.15}.shl.xs{max-height:92vh}.xpm{max-width:380px}.xkh{display:flex;gap:8px;justify-content:flex-end;font-size:11px;color:var(--mu);font-weight:700;margin:2px 0}.xkh span{width:84px;text-align:right}
.xpm{max-width:340px}.xsp{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 6px 4px;max-width:340px;margin:0 auto}.xsp .xpp b{display:block;font-size:17px;margin-top:2px}
.xlb{padding:6px 12px 0;font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}.xpg.cmp .xpp{padding:9px 4px;font-size:14px}
</style>
